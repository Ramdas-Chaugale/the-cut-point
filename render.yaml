# Backend and database. The frontend goes to Vercel separately, because Next.js
# belongs there and this does not.
#
# Deploy order matters:
#   1. this blueprint, which gives you https://cutpoint-api.onrender.com
#   2. that URL into Vercel as NEXT_PUBLIC_API_BASE_URL
#   3. the Vercel URL back into CORS_ORIGINS here, or the browser blocks
#      every request and the app looks broken while being perfectly fine
#
# Everything marked `sync: false` is a secret. Render prompts for it in the
# dashboard on first deploy. None of them belong in this file or in git.

databases:
  - name: cutpoint-db
    plan: free
    databaseName: cutpoint
    user: cutpoint

services:
  - type: web
    name: cutpoint-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run before the server starts, so a schema change ships with
    # the code that needs it rather than being remembered separately.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      - key: DATABASE_URL
        fromDatabase:
          name: cutpoint-db
          property: connectionString

      # Generated once by Render and kept. Rotating it signs everybody out.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # Set this to the Vercel URL after step 2. Comma separated, no trailing
      # slash, and it must be the exact origin the browser sends.
      - key: CORS_ORIGINS
        sync: false

      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FAL_MODEL
        sync: false

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
