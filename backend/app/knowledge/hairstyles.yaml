# CutPoint hairstyle knowledge base — on-trend, barbershop-led catalogue.
#
# Presentation model: a style is tagged EITHER `[unisex]` (androgynous — offered
# for every presentation) OR a specific gender. A masculine request returns
# masculine + unisex; feminine returns feminine + unisex; unisex returns the
# androgynous set only. (See _presentation_ok in services/recommend.py.)
#
# Controlled vocabularies (validated on load, see loader.py):
#   presentations:  masculine | feminine | unisex
#   length:         short | medium | long
#   hair_types:     straight | wavy | curly | coily
#   maintenance:    low | medium | high
#   flattering_for: oval | round | square | oblong | heart | diamond | triangle
#   rationale_tags: adds-height | elongates | softens-angles | adds-width |
#                   balances-forehead | balances-jaw | frames-face |
#                   highlights-bone-structure | adds-texture | adds-volume |
#                   low-upkeep | shortens-face

styles:
  # ---------------- Barbershop / masculine & unisex trend cuts ----------------
  - id: burst-fade
    name: Burst Fade
    presentations: [masculine]
    length: short
    hair_types: [curly, coily, wavy]
    maintenance: medium
    flattering_for: [round, oval, square, diamond, triangle]
    rationale_tags: [adds-texture, highlights-bone-structure]
    description: A fade that curves around the ear with textured length left on top.

  - id: drop-fade-crop
    name: Drop Fade Crop
    presentations: [masculine]
