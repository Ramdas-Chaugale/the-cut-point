# CutPoint hairstyle knowledge base.
#
# Each entry maps a hairstyle to the face shapes it flatters plus the inputs
# used for ranking (presentation, length, hair type, maintenance). `rationale_tags`
# describe the style's effect and drive the "why it suits you" explanation.
#
# Presentation model: a style is tagged EITHER `[unisex]` (genuinely androgynous —
# offered for every presentation) OR a specific gender (`[masculine]` /
# `[feminine]`). A masculine request returns masculine + unisex styles; a
# feminine request returns feminine + unisex; a unisex request returns only the
# androgynous set. (See _presentation_ok in services/recommend.py.)
#
# Controlled vocabularies (validated on load, see loader.py):
#   presentations:  masculine | feminine | unisex
#   length:         short | medium | long
#   hair_types:     straight | wavy | curly | coily
#   maintenance:    low | medium | high
#   flattering_for: oval | round | square | oblong | heart | diamond | triangle
#   rationale_tags: adds-height | elongates | softens-angles | adds-width |
#                   balances-forehead | balances-jaw | frames-face |
#                   highlights-bone-structure | adds-texture | adds-volume |
#                   low-upkeep | shortens-face

styles:
  - id: textured-crop
    name: Textured Crop
    presentations: [unisex]
    length: short
    hair_types: [straight, wavy, coily]
    maintenance: low
    flattering_for: [round, oval, square, triangle, diamond]
    rationale_tags: [adds-texture, adds-height, low-upkeep]
    description: A short cut with textured, slightly longer top and tidy sides.

