[project]
name = "cutpoint-backend"
version = "0.1.0"
description = "CutPoint — AI hairstyle recommendation & salon booking API"
authors = [{ name = "Ramdas Chaugale" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
# Alembic migration scripts are autogenerated — don't lint them.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]  # FastAPI uses function calls in argument defaults (Depends)

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# Matches the venv and CI. Left at 3.11 it rejected numpy's own stubs, which
# use syntax only valid from 3.12, and stopped before checking any of our code.
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # python-jose uses datetime.utcnow internally (their code, not ours).
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
